name: Publish PC tool
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s pc -p 'test_*.py'
      - run: python scripts/package_pc.py --output release/echo-pc.zip
      - name: Publish source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/echo-pc.zip --clobber
          else
            gh release create "$RELEASE_TAG" release/echo-pc.zip --verify-tag --title "Echo $RELEASE_TAG" --generate-notes
          fi

  windows-exe:
    needs: release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build single-file exe
        env:
          ECHO_VERSION: ${{ inputs.tag || github.ref_name }}
        run: python scripts/build_win_exe.py
      - name: Smoke test bundled transcription
        shell: bash
        run: |
          ./release/echo-pc.exe --transcribe web/demo.wav --model tiny --language en --output release/smoke --models release/smoke-models | cat
          test -s release/smoke/demo_*.echo.zip
      - name: Publish exe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$env:RELEASE_TAG" release/echo-pc.exe --clobber

  mac-app:
    needs: release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build self-contained app
        env:
          ECHO_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          python -m pip install uv==0.13.6
          uv python install 3.12
          scripts/build_mac_app.sh "$(uv python find --managed-python 3.12)"
      - name: Smoke test bundled transcription
        run: |
          "release/mac/Echo PC.app/Contents/MacOS/Echo PC" --transcribe web/demo.wav --model tiny --language en --output release/smoke --models release/smoke-models
          test -s release/smoke/demo_*.echo.zip
      - name: Publish app ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release/echo-pc-mac-arm64.zip --clobber
